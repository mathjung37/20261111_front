<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#163b3a" />
    <meta
      name="description"
      content="오늘의 업무를 정리하고 Agent와 함께 내일의 계획을 만드는 업무 데스크"
    />
    <title>내일의 데스크</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 rx=%2216%22 fill=%22%23163b3a%22/><path d=%22M19 19h26v8H27v18h-8z%22 fill=%22%23c8f36a%22/><path d=%22M33 33h12v12H33z%22 fill=%22%23f7f5ed%22/></svg>" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./config.js"></script>
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">본문으로 이동</a>
    <div class="page-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="내일의 데스크 홈">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i></span>
          <span>내일의 데스크</span>
        </a>
        <div class="day-marker" aria-label="오늘 날짜">
          <span id="today-label"></span>
          <span class="status-dot">정리 중</span>
        </div>
      </header>

      <main id="main-content" class="workspace">
        <section class="work-sheet" aria-labelledby="work-heading">
          <div class="sheet-intro">
            <p class="step-label">오늘을 닫는 시간</p>
            <h1 id="work-heading">머릿속 업무를<br />여기에 내려놓으세요.</h1>
            <p>완벽하게 정리하지 않아도 됩니다. 한 줄에 하나씩 적으면 다음 계획은 함께 만들게요.</p>
          </div>

          <form id="work-form" class="work-form">
            <label class="field-block" for="completed-work">
              <span class="field-title"><b>오늘 한 업무</b><em id="completed-count">0개</em></span>
              <textarea
                id="completed-work"
                name="completedWork"
                rows="6"
                placeholder="예) 로그인 화면 와이어프레임 완성"
                autocomplete="off"
              ></textarea>
              <small>완료했거나 진행한 일을 한 줄에 하나씩 적어주세요.</small>
            </label>

            <label class="field-block" for="upcoming-work">
              <span class="field-title"><b>앞으로 할 업무</b><em id="upcoming-count">0개</em></span>
              <textarea
                id="upcoming-work"
                name="upcomingWork"
                rows="6"
                placeholder="예) API 응답 형식 백엔드와 합의"
                autocomplete="off"
              ></textarea>
              <small>남은 일, 새로 떠오른 일, 마감이 있는 일을 적어주세요.</small>
            </label>

            <div id="form-error" class="inline-message" role="alert" hidden></div>
            <button id="submit-work" class="primary-action" type="submit">
              <span>업무를 바탕으로 계획 시작</span>
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6" /></svg>
            </button>
          </form>
        </section>

        <section class="planning-desk" aria-labelledby="planning-heading">
          <div id="empty-state" class="empty-state">
            <div class="orbit" aria-hidden="true"><span></span></div>
            <p>업무 목록을 보내면</p>
            <h2 id="planning-heading">내일의 윤곽이<br />이곳에 나타납니다.</h2>
            <ul>
              <li>해야 할 일의 우선순위를 함께 정해요.</li>
              <li>애매한 일정은 대화로 구체화해요.</li>
              <li>마지막에 내일의 목록으로 저장해요.</li>
            </ul>
          </div>

          <div id="active-planner" class="active-planner" hidden>
            <div class="planner-heading">
              <div>
                <p>계획 대화</p>
                <h2>무엇부터 시작할까요?</h2>
              </div>
              <button id="reset-session" class="text-action" type="button">처음부터</button>
            </div>

            <div id="chat-log" class="chat-log" role="log" aria-live="polite"></div>

            <form id="chat-form" class="chat-composer">
              <label class="sr-only" for="chat-message">Agent에게 보낼 메시지</label>
              <textarea
                id="chat-message"
                rows="1"
                placeholder="예) 오전에는 회의가 있어서 집중 업무는 오후가 좋아요."
              ></textarea>
              <button id="send-message" type="submit" aria-label="메시지 보내기">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m4 5 17 7-17 7 3-7-3-7Zm3 7h14" /></svg>
              </button>
            </form>

            <div class="plan-divider"><span>내일의 목록</span></div>
            <div id="plan-list" class="plan-list"></div>
            <button id="add-plan-item" class="add-plan-item" type="button">+ 할 일 직접 추가</button>

            <div id="planner-error" class="inline-message" role="alert" hidden></div>
            <button id="finalize-plan" class="finalize-action" type="button">
              <span>이 계획으로 내일 시작</span>
              <small id="plan-summary">0개의 할 일</small>
            </button>
          </div>
        </section>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <dialog id="success-dialog" class="success-dialog">
      <div class="success-symbol" aria-hidden="true"><span>✓</span></div>
      <p>내일의 계획</p>
      <h2>정리한 만큼,<br />가볍게 시작할 수 있어요.</h2>
      <p id="success-copy"></p>
      <button id="close-dialog" class="primary-action" type="button">확인</button>
    </dialog>
  </body>
</html>
